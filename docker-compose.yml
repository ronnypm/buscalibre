services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pricetracker
      POSTGRES_PASSWORD: pricetracker
      POSTGRES_DB: pricetracker
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pricetracker"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://pricetracker:pricetracker@db:5432/pricetracker
      ENABLE_SCANNER: "1"
      SCAN_INTERVAL_MINUTES: "60"
    env_file:
      - .env
    ports:
      - "8000:8000"

volumes:
  pgdata: