# Render (blueprint). Ajustá el "plan" a paid (starter) si querés que nunca hiiberne.
# El plan free apaga el servicio a los 15 min sin tráfico -> detiene los escaneos.
services:
  - type: web
    name: pricetracker
    runtime: docker
    plan: starter
    dockerfilePath: Dockerfile
    healthCheckPath: /health
    envVars:
      # La BD vive en Supabase (Postgres free). Acá va el connection string de Supabase.
      - key: DATABASE_URL
        sync: false
      - key: BUSD_EMAIL
        sync: false
      - key: BUSD_PASSWORD
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: KILO_API_KEY
        sync: false
      - key: SCAN_INTERVAL_MINUTES
        sync: false
      - key: ENABLE_SCANNER
        sync: false