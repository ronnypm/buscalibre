# Render (blueprint). Ajustá el "plan" a paid (starter) si querés que nunca hiiberne.
# El plan free apaga el servicio a los 15 min sin tráfico -> detiene los escaneos.
services:
  - type: web
    name: pricetracker
    runtime: docker
    plan: starter
    dockerfilePath: pricetracker/Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pricetracker-db
          property: connectionString
      - key: BUSD_EMAIL
        sync: false
      - key: BUSD_PASSWORD
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: SCAN_INTERVAL_MINUTES
        sync: false
      - key: ENABLE_SCANNER
        sync: false

databases:
  - name: pricetracker-db
    plan: basic-256mb